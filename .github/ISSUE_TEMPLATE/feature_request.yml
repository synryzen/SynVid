name: Feature request
description: Share an improvement to a creator workflow without sensitive material.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: >-
        Do not upload private recordings, credentials, license information, OAuth tokens,
        complete crash logs, or unredacted diagnostic bundles. Contact support@synryzen.com
        for anything security- or privacy-sensitive.
  - type: textarea
    id: creator-workflow
    attributes:
      label: Creator workflow
      description: Describe the workflow you are trying to complete.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is difficult or missing today?
    validations:
      required: true
  - type: textarea
    id: desired-outcome
    attributes:
      label: Desired outcome
      description: What would a successful experience look like?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: What alternatives or workarounds have you tried?
    validations:
      required: true
